# Runs the KPI pipeline's tests on every push, and rebuilds the report every Monday.
# NOTE: if you move 05-kpi-pipeline into its own repo, put this file in that repo's
# .github/workflows/ and delete the `defaults:` block below.
name: kpi-report

on:
  push:
    paths: ["05-kpi-pipeline/**"]
  schedule:
    - cron: "0 3 * * 1"      # every Monday 03:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-kpi-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 05-kpi-pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Build report (demo data; swap --demo for --data-dir data once real data is available)
        run: python src/main.py --demo
      - uses: actions/upload-artifact@v4
        with:
          name: kpi-report
          path: 05-kpi-pipeline/outputs/
